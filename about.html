<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="About the developer: background, education, certifications and current learning." />
  <meta name="theme-color" content="#f3ede2" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Portfolio" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <title>About · Portfolio</title>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Hanken+Grotesk:wght@400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="about">
  <main id="main" tabindex="-1">
    <header class="page-head container">
      <p class="label">About</p>
      <h1>About me</h1>
      <p id="aboutIntro"></p>
    </header>

    <section class="section tight container split">
      <div>
        <div class="about-body reveal" id="aboutParas"></div>
        <div class="btn-row" style="margin-top:28px">
          <a class="btn btn-primary" href="contact.html">Work with me</a>
          <a class="btn btn-ghost" href="experience.html">Work history</a>
        </div>
      </div>
      <figure class="about-art reveal">
        <img src="assets/img/avatar.svg" alt="Illustrated placeholder portrait. Replace with your own photo." width="480" height="480" loading="lazy" />
        <ul class="facts" id="facts"></ul>
      </figure>
    </section>

    <section class="section tight container">
      <div class="hero-meta reveal" id="aboutStats"></div>
    </section>

    <section class="section container" aria-labelledby="edu-title">
      <div class="section-head"><div><p class="label reveal">Background</p><h2 class="section-title reveal" id="edu-title">Education and certifications</h2></div></div>
      <div class="two-col">
        <div>
          <h3 class="col-title reveal">Education</h3>
          <ol class="timeline" id="education"></ol>
        </div>
        <div>
          <h3 class="col-title reveal">Certifications</h3>
          <ol class="timeline" id="certs"></ol>
        </div>
      </div>
    </section>

    <section class="section tight container" aria-labelledby="now-title">
      <div class="now-card reveal">
        <p class="label">Right now</p>
        <h2 class="section-title" id="now-title">What I'm working on</h2>
        <ul class="now-list" id="now"></ul>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="common.js"></script>
</body>
</html>
